[build-system]
build-backend = "setuptools.build_meta"

requires = [
  "setuptools>=77",
]

[project]
name = "master-splinter-api"
version = "0.1.0"
description = "FastAPI service wrapping master-splinter's dive profile and altitude analysers"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Bruno Paes", email = "bpaes@bloomberg.net" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "fastapi>=0.115,<1",
  "master-splinter>=0.1,<1",
  "uvicorn[standard]>=0.30,<1",
]
optional-dependencies.dev = [
  "ruff==0.14.2",
  "tox-uv>=1.9.1,<2",
]
optional-dependencies.test = [
  "httpx>=0.27,<1",  # fastapi.testclient.TestClient
  "pytest>=7.4",
  "pytest-cov>=4.1",
]

[tool.setuptools]
packages = [
  "api",
  "api.clients",
  "api.handlers",
  "api.processors",
  "api.utils",
]
package-dir = { api = "src" }

[tool.ruff]
target-version = "py311"
line-length = 79
src = [
  "src",
  "tests",
]
exclude = [
  "__pycache__",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"

[tool.coverage.report]
show_missing = true
exclude_lines = [ "pragma: no cover" ]

[tool.coverage.run]
omit = [ "**/__init__.py" ]
source = [ "api" ]
